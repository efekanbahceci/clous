[package]
name = "sierraport"
version = "0.2.0"
edition = "2024"
description = "Advanced, zero-dependency terminal port monitoring, security audit & inspection CLI tool"
license = "MIT"

[[bin]]
name = "sierraport"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
